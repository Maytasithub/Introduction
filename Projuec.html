<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8" />
<title>โปรเจ็ก</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
html, body {
  margin: 0; height: 100%; overflow: hidden;
  background: linear-gradient(180deg, #4a0000, #8b0000, #ff0000);
  font-family: sans-serif; transition: background 2s ease-in-out;
}
canvas { display: none; }

#startBtn {
  position: absolute; 
  top: 50%; 
  left: 50%;
  transform: translate(-50%, -50%);
  padding: 15px 40px;    
  font-size: 24px;        
  font-weight: bold;
  background: #000; 
  color: #ff0000; 
  border: 3px solid #ff0000;
  border-radius: 12px;
  cursor: pointer; 
  z-index: 10;
  box-shadow: 0 0 15px #ff0000;  
  text-shadow: 0 0 8px #ff0000;  
  transition: all 0.3s ease;
}

#startBtn:hover {
  transform: translate(-50%, -50%) scale(1.05);
  color: #ff5555; 
  box-shadow: 0 0 30px #ff2222;
}

#toggleLightBtn {
  position: absolute; top: 10px; right: 10px; padding: 10px 20px;
  font-size: 18px; background: #222; color: #fff; border: none;
  cursor: pointer; z-index: 20; opacity: 0.8; display: none;
}
#toggleLightBtn:hover { opacity: 1; }
#fadeOverlay {
  position: fixed; top:0; left:0; width:100%; height:100%;
  background:black; opacity:0; transition:opacity 2s ease-in-out;
  pointer-events:none; z-index:15;
}
#logoText {
  position:absolute; top:8%; right:5%;
  color: rgba(245, 1, 1, 1); font-size:15px;
  font-family:'Impact', sans-serif; letter-spacing:5px;
  text-align:right; line-height:1.1; user-select:none;
}
#coords {
  position:absolute; top:10px; left:10px;
  color:#fff; background:rgba(0,0,0,0.6);
  padding:8px 15px; border-radius:8px; font-size:18px;
  z-index:25; display:none; font-family:monospace;
}
</style>
</head>
<body>
<div id="logoText">
  หมายเหตุชื่อจะอยู่ด้านหลังจากกล้องเริ่มต้นนะครับ<br>S เพื่อเปิด/ปิดไฟฉาย<br>Spacebar เพื่อกลับกล้องเริ่มต้น<br>1 ไปดู Mater PBR <br>2 ดูเครดิต <br>3 ดูโมเดล Fox 
</div>

<button id="startBtn">คลิกเพื่อเข้าสู่โปรเจ็ก</button>
<button id="toggleLightBtn">ปิดไฟ</button>
<div id="fadeOverlay"></div>
<div id="coords"></div>
<audio id="soundOn" src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg" preload="auto"></audio>
<audio id="soundOff" src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg" preload="auto"></audio>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script>
(() => {
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
  camera.position.set(57, 19, 161);
  const renderer = new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  document.body.appendChild(renderer.domElement);
  const controls = new THREE.PointerLockControls(camera, renderer.domElement);
  scene.add(controls.getObject());
  const btn = document.getElementById("startBtn");
  const toggleLightBtn = document.getElementById("toggleLightBtn");
  const fadeOverlay = document.getElementById("fadeOverlay");
  const logoText = document.getElementById("logoText");
  const audioOn = document.getElementById("soundOn");
  const audioOff = document.getElementById("soundOff");
  const coordsDiv = document.getElementById("coords");
  btn.onclick = () => {
    document.body.style.background="#000";
    fadeOverlay.style.opacity=1;
    setTimeout(()=>{
      fadeOverlay.style.opacity=0;
      btn.style.display="none";
      logoText.style.display="none";
      toggleLightBtn.style.display="block";
      coordsDiv.style.display="block";
      document.querySelector("canvas").style.display="block";
      controls.lock();
      loadMap();
      createDoors();
      loadRotatingModels();
    },2000);
  };
  scene.add(new THREE.AmbientLight(0xffffff,0.2));
  const spotlight = new THREE.SpotLight(0xffffff,5,500,Math.PI/5,0.6,2);
  spotlight.castShadow=true;
  spotlight.shadow.mapSize.width=2048;
  spotlight.shadow.mapSize.height=2048;
  spotlight.shadow.radius=4;
  scene.add(spotlight);
  scene.add(spotlight.target);
  let lightOn=true;
  function toggleLight(){
    lightOn=!lightOn;
    spotlight.intensity=lightOn?5:0;
    toggleLightBtn.textContent=lightOn?"ปิดไฟ":"เปิดไฟ";
    (lightOn?audioOn:audioOff).play();
  }
  toggleLightBtn.onclick=toggleLight;
  window.addEventListener("keydown", e=>{if(e.key.toLowerCase()==="e") toggleLight();});
  const loader = new THREE.GLTFLoader();
  let dearModel, model1, model2, model3;
  let light1, light2;
  function loadMap(){
    loader.load('./Mapfive.glb', g=>{
      g.scene.scale.set(0.2,0.2,0.2);
      g.scene.position.set(-4.5,0.5,70);
      g.scene.traverse(obj=>{if(obj.isMesh){obj.castShadow=true; obj.receiveShadow=true;}});
      scene.add(g.scene);
    });
    loader.load('./Maytasit.glb', g=>{
      dearModel=g.scene;
      dearModel.scale.set(0.4,0.4,0.4);
      dearModel.position.set(60,15,200);
      dearModel.rotation.y=Math.PI/2;
      dearModel.traverse(obj=>{if(obj.isMesh){obj.castShadow=true; obj.receiveShadow=true;}});
      scene.add(dearModel);
    });
    loader.load('./Fox.glb', g=>{
      const fox=g.scene;
      fox.scale.set(15,15,15);
      fox.position.set(56,3,100);
      fox.traverse(obj=>{if(obj.isMesh){obj.castShadow=true; obj.receiveShadow=true;}});
      scene.add(fox);
    });

    const windowLight=new THREE.SpotLight(0xfff8cc,3,500,Math.PI/12,0.2,2);
    windowLight.position.set(-50,50,0);
    windowLight.castShadow=true;
    scene.add(windowLight);
  }

  function loadRotatingModels(){
    
    loader.load('./4.glb', g => {
      model3 = g.scene;
      model3.position.set(88, 18,80);
      model3.scale.set(0.3,0.3,0.3);
      model3.traverse(obj => { if(obj.isMesh){ obj.castShadow=true; obj.receiveShadow=true; }});
      scene.add(model3);
    });
    loader.load('./1.glb', g=>{
      model1=g.scene;
      model1.position.set(26,15,78);
      model1.scale.set(5,5,5);
      model1.traverse(obj=>{if(obj.isMesh){obj.castShadow=true; obj.receiveShadow=true;}});
      scene.add(model1);

      light1 = new THREE.SpotLight(0xffaa00, 3, 200, Math.PI/4, 0.6, 2);
      light1.position.set(26,50,78);
      light1.target.position.copy(model1.position);
      light1.castShadow=true;
      scene.add(light1); scene.add(light1.target);
    });
    loader.load('./2.glb', g=>{
      model2=g.scene;
      model2.position.set(16,15,78);
      model2.scale.set(5,5,5);
      model2.traverse(obj=>{if(obj.isMesh){obj.castShadow=true; obj.receiveShadow=true;}});
      scene.add(model2);
      light2 = new THREE.SpotLight(0x00aaff, 3, 200, Math.PI/4, 0.6, 2);
      light2.position.set(30,50,78);
      light2.target.position.copy(model2.position);
      light2.castShadow=true;
      scene.add(light2); scene.add(light2.target);
    });
  }

  const velocity=new THREE.Vector3(), direction=new THREE.Vector3();
  const move={forward:false,backward:false,left:false,right:false};
  let moveTarget=null;

  document.addEventListener('keydown', e=>{
    switch(e.key.toLowerCase()){
      case'w':move.forward=true;break;
      case's':move.backward=true;break;
      case'a':move.left=true;break;
      case'd':move.right=true;break;
      case' ': moveTarget=new THREE.Vector3(57,19,161); break;
    }
  });
  document.addEventListener('keyup', e=>{
    switch(e.key.toLowerCase()){
      case'w':move.forward=false;break;
      case's':move.backward=false;break;
      case'a':move.left=false;break;
      case'd':move.right=false;break;
    }
  });
  window.addEventListener('keydown', e=>{
    if(e.key==='1') moveTarget=new THREE.Vector3(18,19,93);
    if(e.key==='2') moveTarget=new THREE.Vector3(88,18,93);
    if(e.key==='3') moveTarget=new THREE.Vector3(56,19,124);
    if(e.key==='4') moveTarget=new THREE.Vector3(56,19,161);
  });

  const doors=[];
  function createDoors(){
    const geo=new THREE.BoxGeometry(3,10,0.5);
    const mat=new THREE.MeshStandardMaterial({color:0x4444ff});
    const doorLeft=new THREE.Mesh(geo, mat);
    const doorRight=new THREE.Mesh(geo, mat);
    doorRight.position.set(88,5,125);
  }

  const raycaster=new THREE.Raycaster();
  const mouse=new THREE.Vector2();
  

  const clock=new THREE.Clock();

  function animate(){
    requestAnimationFrame(animate);
    const delta=clock.getDelta();

    velocity.x-=velocity.x*10.0*delta;
    velocity.z-=velocity.z*10.0*delta;
    direction.z=Number(move.forward)-Number(move.backward);
    direction.x=Number(move.right)-Number(move.left);
    direction.normalize();
    const speed=80.0*delta;
    if(move.forward||move.backward) velocity.z-=direction.z*speed;
    if(move.left||move.right) velocity.x-=direction.x*speed;
    controls.moveRight(-velocity.x*delta);
    controls.moveForward(-velocity.z*delta);

    if(moveTarget){
      camera.position.lerp(moveTarget, 2*delta);
      if(camera.position.distanceTo(moveTarget)<0.5) moveTarget=null;
    }

    if(model1) model1.rotation.y += 0.5*delta;
    if(model2) model2.rotation.y += 0.5*delta;
    if(model3) model3.rotation.y += 0.5*delta;

    spotlight.position.copy(camera.position);
    const dir=new THREE.Vector3();
    camera.getWorldDirection(dir);
    spotlight.target.position.copy(camera.position.clone().add(dir.multiplyScalar(50)));

    coordsDiv.textContent=`x: ${camera.position.x.toFixed(2)}  y: ${camera.position.y.toFixed(2)}  z: ${camera.position.z.toFixed(2)}`;

    renderer.render(scene,camera);
  }
  animate();
})();
</script>
</body>
</html>
